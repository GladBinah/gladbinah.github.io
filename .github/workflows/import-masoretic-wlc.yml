name: Import Masoretic WLC reference text

on:
  push:
    paths:
      - "scripts/import_masoretic_wlc.py"
      - ".github/workflows/import-masoretic-wlc.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-wlc:
    if: github.repository == 'GladBinah/bible-project-internal' || github.repository == 'GladBinah/gladbinah.github.io'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate books from pinned OSHB XML and validate completeness
        run: python3 scripts/import_masoretic_wlc.py
      - name: Commit validated Hebrew references
        shell: bash
        run: |
          set -euo pipefail
          git add docs/source-texts/wlc
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
               commit -m "Import pinned WLC Masoretic Hebrew Bible reference corpus"
            git push origin HEAD:main
          fi
