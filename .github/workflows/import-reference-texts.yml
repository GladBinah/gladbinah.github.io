name: Import public-domain reference texts

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/import_reference_texts.py'
      - '.github/workflows/import-reference-texts.yml'

permissions:
  contents: write

concurrency:
  group: import-reference-texts
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'GladBinah/gladbinah.github.io'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned sources and verify all book and verse records
        run: python scripts/import_reference_texts.py
      - name: Publish source reference files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/source-texts/kjv1769 docs/source-texts/scrivener1894 docs/source-texts/krv1961 docs/source-texts/import-manifest.json
          if git diff --cached --quiet; then
            echo 'No changes to publish.'
          else
            git commit -m 'Import verified KJV 1769 and Scrivener 1894 book-level texts'
            git push origin HEAD:main
          fi
